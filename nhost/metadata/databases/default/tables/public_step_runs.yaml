table:
  name: step_runs
  schema: public
object_relationships:
  - name: step
    using:
      foreign_key_constraint_on: step_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - approved_at
        - approved_by
        - attempt_count
        - completed_at
        - error
        - id
        - input
        - output
        - started_at
        - status
        - step_id
        - workflow_run_id
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      check: null
      columns:
        - status
        - approved_by
        - approved_at
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - role:
                          _eq: owner
                      - role:
                          _eq: editor
