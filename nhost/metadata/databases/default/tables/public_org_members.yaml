table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - org_id
        - role
        - user_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
